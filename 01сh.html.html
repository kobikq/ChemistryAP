<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Химия для школьников — задания</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f7fb;
    color: #22303f;
  }
  header {
    background: #1f6f8b;
    color: white;
    padding: 28px 16px;
    text-align: center;
  }
  header h1 { margin: 0 0 8px; }
  main {
    max-width: 760px;
    margin: 24px auto;
    padding: 0 16px;
  }
  .card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 4px 14px rgba(31, 111, 139, .12);
  }
  .question {
    font-weight: bold;
    margin-bottom: 12px;
  }
  label {
    display: block;
    padding: 10px 12px;
    border: 1px solid #d8e3ea;
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  label:hover { background: #eef6f9; }
  button {
    background: #1f6f8b;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover { background: #175a72; }
  .feedback {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    display: none;
  }
  .correct { background: #e6f7ec; border: 1px solid #7ac79a; }
  .wrong { background: #fdecec; border: 1px solid #e08a8a; }
  #result { font-size: 20px; font-weight: bold; }
  footer {
    text-align: center;
    padding: 20px;
    color: #5d6b7a;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>Химия для школьников</h1>
  <p>Интерактивные задания с мгновенной проверкой</p>
</header>

<main>
  <div class="card">
    <div id="quiz"></div>
    <button id="checkBtn">Проверить ответы</button>
    <div id="result"></div>
  </div>
</main>

<footer>Учебный проект: задания по химии для школьников</footer>

<script>
const tasks = [
  {
    question: "1. Какое явление относится к химическим?",
    options: ["Плавление льда", "Горение magnesium", "Испарение воды", "Измельчение сахара"],
    answer: 1,
    explanation: "Горение — химическая реакция, при которой образуются новые вещества."
  },
  {
    question: "2. Химическая формула воды:",
    options: ["CO₂", "H₂O", "NaCl", "O₂"],
    answer: 1,
    explanation: "Вода состоит из двух атомов водорода и одного атома кислорода."
  },
  {
    question: "3. Какой элемент обозначается символом Fe?",
    options: ["Фтор", "Фосфор", "Железо", "Сера"],
    answer: 2,
    explanation: "Fe — химический символ железа."
  },
  {
    question: "4. Валентность кислорода в большинстве соединений:",
    options: ["I", "II", "III", "IV"],
    answer: 1,
    explanation: "Кислород обычно двухвалентен."
  },
  {
    question: "5. Что показывает индекс в формуле H₂SO₄ у кислорода?",
    options: ["Заряд иона", "Число атомов кислорода", "Номер группы", "Массу атома"],
    answer: 1,
    explanation: "Индекс 4 означает, что в молекуле четыре атома кислорода."
  }
];

const quiz = document.getElementById("quiz");

tasks.forEach((task, index) => {
  const block = document.createElement("div");
  block.className = "card";
  block.innerHTML = `<div class="question">${task.question}</div>`;

  task.options.forEach((option, optionIndex) => {
    const label = document.createElement("label");
    label.innerHTML = `
      <input type="radio" name="q${index}" value="${optionIndex}">
      ${option}
    `;
    block.appendChild(label);
  });

  const feedback = document.createElement("div");
  feedback.className = "feedback";
  feedback.id = `feedback-${index}`;
  block.appendChild(feedback);

  quiz.appendChild(block);
});

document.getElementById("checkBtn").addEventListener("click", () => {
  let score = 0;

  tasks.forEach((task, index) => {
    const selected = document.querySelector(`input[name="q${index}"]:checked`);
    const feedback = document.getElementById(`feedback-${index}`);
    feedback.style.display = "block";

    if (selected && Number(selected.value) === task.answer) {
      score++;
      feedback.className = "feedback correct";
      feedback.textContent = "Верно! " + task.explanation;
    } else {
      feedback.className = "feedback wrong";
      feedback.textContent = "Неверно. " + task.explanation;
    }
  });

  document.getElementById("result").textContent =
    `Результат: ${score} из ${tasks.length}`;
});
</script>

</body>
</html>
